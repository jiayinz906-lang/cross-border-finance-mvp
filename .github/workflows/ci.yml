name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build backend
        run: pnpm --filter cross-border-finance-server build

      - name: Build frontend
        run: pnpm --filter cross-border-finance-client build

      - name: Verify runtime operations
        run: pnpm verify:operations

      - name: Verify maintenance write blocking
        run: pnpm verify:maintenance

      - name: Audit money precision
        run: pnpm audit:money-precision

      - name: Verify migration comparison tooling
        run: pnpm verify:migration-tooling

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate Tencent Compose
        env:
          TENCENT_ENV_FILE: .env.tencent.example
        run: docker compose --env-file .env.tencent.example -f docker-compose.tencent.yml config >/dev/null
